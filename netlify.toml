[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# A geracao de imagem pode passar de um minuto. Background Function roda ate 15.
[functions."generate-images-background"]
  included_files = []

[functions."generate-copy-background"]
  included_files = []

# Renova ciclos de assinatura e concede os creditos do novo periodo.
[functions."cron-renew-subscriptions"]
  schedule = "0 8 * * *"

# Higiene: limpa rate limits, expira webhooks antigos e recolhe job travado.
[functions."cron-maintenance"]
  schedule = "*/20 * * * *"

# SPA: qualquer rota do app cai no index.html. Assets e functions tem
# precedencia sobre esta regra, entao ela nao quebra /.netlify/functions.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # connect-src precisa do Supabase (auth, dados e storage assinado).
    # data: em img-src e obrigatorio: o QR do PIX chega como data URL.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
